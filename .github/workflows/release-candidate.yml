name: Release candidate matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            package-os: linux
            package-cpu: x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            package-os: linux
            package-cpu: arm64
          - runner: macos-15-intel
            target: darwin-x64
            package-os: darwin
            package-cpu: x64
          - runner: macos-15
            target: darwin-arm64
            package-os: darwin
            package-cpu: arm64
          - runner: windows-2025
            target: win32-x64
            package-os: win32
            package-cpu: x64
          - runner: windows-11-arm
            target: win32-arm64
            package-os: win32
            package-cpu: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the exact target dependency graph
        run: bun install --frozen-lockfile --ignore-scripts --os=${{ matrix.package-os }} --cpu=${{ matrix.package-cpu }}
      - name: Audit the dependency graph
        run: bun audit --json
      - name: Verify source gate
        run: bun run check
      - name: Build final target package
        run: bun run build:release ${{ matrix.target }}
      - name: Install and exercise final npm tarballs
        run: bun run test:release ${{ matrix.target }}
      - name: Reject whitespace damage
        run: git diff --check
